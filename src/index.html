const nodes = new vis.DataSet();
const edges = new vis.DataSet();
const nodeMap = {};

function addNode(id, label, group, data) {
  if (!nodeMap[id]) {
    const n = { id, label, group, ...data };
    nodes.add(n);
    nodeMap[id] = n;
  }
  return id;
}

  if (stato === 'detenuto') return '#fb7185';
  if (stato === 'morto') return '#447744';
  return '#22d3ee';

});

    const memId = `mem_${m.replace(/[^a-zA-Z]/g,'_')}`;
    if (!nodeMap[memId]) {
      addNode(memId, m, 'person', { color: { background: '#22d3ee', border: '#383' }, shape: 'dot', size: 12, title: `${m} — ${g.clan_dominante}` });
    }
    edges.add({ from: clanId, to: memId, color: { color: '#447744', opacity: 0.3 }, width: 1 });
  });
});

// Add detailed clan members from CLANS data
CLANS.forEach(c => {
  const personId = `person_${c.nome.replace(/[^a-zA-Z]/g,'_')}`;
  const color = getColor(c.stato);
  addNode(personId, c.nome, 'person_detail', { 
    color: { background: color, border: color }, 
    shape: 'dot', size: 18, 
    title: `${c.nome} — ${c.ruolo}`,
    _data: c 
  });
  
  // Link to clan
  const clanId = `clan_${c.clan.replace(/[^a-zA-Z]/g,'_')}`;
  if (!nodeMap[clanId]) {
    addNode(clanId, c.clan, 'clan', { color: { background: '#00ff41', border: '#00aa28' }, shape: 'box', font: { color: '#000', size: 11 }, size: 20 });
  }
  edges.add({ from: clanId, to: personId, color: { color: color, opacity: 0.6 }, width: 2 });
  
  // Link to city
  const cityId = `city_${c.citta.replace(/[^a-zA-Z() ]/g,'_').replace(/ /g,'_')}`;
  if (nodeMap[cityId]) {
    edges.add({ from: cityId, to: personId, color: { color: '#1a3a1a', opacity: 0.3 }, dashes: true, width: 1 });
  }
});

// Add external organizations
const orgSet = new Set();
CONNESSIONI.forEach(c => {
  const orgName = c.organizzazione_esterna.split('/')[0].split('(')[0].trim();
  orgSet.add(orgName);
});
orgSet.forEach(org => {
  const orgId = `org_${org.replace(/[^a-zA-Z]/g,'_')}`;
  addNode(orgId, org, 'external', { color: { background: '#a78bfa', border: '#7c5cbf' }, shape: 'triangle', size: 22, title: org });
});

// Add connection edges
CONNESSIONI.forEach((c, i) => {
  const personId = `person_${c.persona_scu.replace(/[^a-zA-Z]/g,'_')}`;
  const orgName = c.organizzazione_esterna.split('/')[0].split('(')[0].trim();
  const orgId = `org_${orgName.replace(/[^a-zA-Z]/g,'_')}`;
  
  // If person node doesn't exist, create it
  if (!nodeMap[personId]) {
    addNode(personId, c.persona_scu, 'person_conn', { color: { background: '#447744', border: '#447744' }, shape: 'dot', size: 12, title: `${c.persona_scu} — ${c.clan_scu}` });
  }
  
  const edgeColor = c.tipo_connessione.toLowerCase().includes('droga') ? '#fb7185' : 
                    c.tipo_connessione.toLowerCase().includes('fondaz') ? '#00ff41' : '#a78bfa';
  edges.add({ 
    from: personId, to: orgId, 
    color: { color: edgeColor, opacity: 0.5 }, 
    width: 2, 
    title: `${c.tipo_connessione}\n${c.periodo}\nFonte: ${c.fonte}`,
    _connData: c
  });
});

// === RENDER ===
const container = document.getElementById('network');
const data = { nodes, edges };
const options = {
  physics: { enabled: true, solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -80, springLength: 150, springConstant: 0.04 }, stabilization: { iterations: 200 } },
  interaction: { hover: true, tooltipDelay: 100, zoomView: true, dragView: true },
  nodes: { font: { color: '#aaffaa', size: 11 }, borderWidth: 1 },
  edges: { smooth: { type: 'continuous', roundness: 0.3 }, arrows: { to: { enabled: false } } }
};

const network = new vis.Network(container, data, options);

// Stats
document.getElementById('stats').textContent = `${nodes.length} nodi · ${edges.length} connessioni · ${CLANS.length} profili dettagliati`;

// === SIDEBAR ON CLICK ===
network.on('click', function(params) {
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('sidebar-content');
  
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    const node = nodes.get(nodeId);
    let html = `<h2>${node.label}</h2>`;
    
    if (node._data) {
      const d = node._data;
      html += `<p><strong>Ruolo:</strong> ${d.ruolo}</p>`;
      html += `<p><strong>Città:</strong> ${d.citta} (${d.provincia})</p>`;
      html += `<p><strong>Stato:</strong> <span class="tag tag-${d.stato}">${d.stato.toUpperCase()}</span></p>`;
      html += `<p><strong>Note:</strong> ${d.note}</p>`;
      
      if (d.arresti && d.arresti.length) {
        html += `<h3>Arresti</h3><ul>`;
        d.arresti.forEach(a => html += `<li><strong>${a.data}</strong> — ${a.operazione}<br><em>${a.esito}</em></li>`);
        html += `</ul>`;
      }
      if (d.condanne && d.condanne.length) {
        html += `<h3>Condanne</h3><ul>`;
        d.condanne.forEach(c => html += `<li><strong>${c.anno}</strong> — ${c.anni_carcere} anni<br><em>${c.tribunale}</em></li>`);
        html += `</ul>`;
      }
    } else if (node.group === 'external') {
      html += `<p><span class="tag tag-org">Organizzazione Esterna</span></p>`;
      const relConns = CONNESSIONI.filter(c => c.organizzazione_esterna.includes(node.label));
      if (relConns.length) {
        html += `<h3>Connessioni Documentate (${relConns.length})</h3><ul>`;
        relConns.forEach(c => html += `<li><strong>${c.persona_scu}</strong> (${c.clan_scu})<br>${c.tipo_connessione}<br><em>${c.periodo}</em></li>`);
        html += `</ul>`;
      }
    } else if (node.group === 'province') {
      const cities = GEOGRAFIA.filter(g => g.provincia === node.label);
      html += `<h3>Città (${cities.length})</h3><ul>`;
      cities.forEach(c => html += `<li><strong>${c.citta}</strong> — ${c.clan_dominante}<br><em>${c.periodo_attivita}</em></li>`);
      html += `</ul>`;
    } else {
      html += `<p>Gruppo: ${node.group}</p>`;
      if (node.title) html += `<p>${node.title}</p>`;
    }
    
    content.innerHTML = html;
    sidebar.classList.add('open');
  } else {
    sidebar.classList.remove('open');
  }
});

document.getElementById('close-sidebar').onclick = () => document.getElementById('sidebar').classList.remove('open');

// === FILTERS ===
function buildFilters() {
  // Province filters
  const provDiv = document.getElementById('filter-province');
  provinceList.forEach(p => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" checked data-prov="${p}"> ${p}`;
    provDiv.appendChild(lbl);
  });
  
  // Org filters
  const orgDiv = document.getElementById('filter-org');
  orgSet.forEach(org => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" checked data-org="${org}"> ${org}`;
    orgDiv.appendChild(lbl);
  });
  
  // Connection type filters
  const connTypes = [...new Set(CONNESSIONI.map(c => c.tipo_connessione.split(',')[0].trim()))];
  const connDiv = document.getElementById('filter-conn');
  connTypes.forEach(t => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" checked data-conn="${t}"> ${t}`;
    connDiv.appendChild(lbl);
  });
}
buildFilters();

// Filter logic
document.addEventListener('change', function(e) {
  if (e.target.type !== 'checkbox') return;
  
  const activeProvs = [...document.querySelectorAll('[data-prov]:checked')].map(el => el.dataset.prov);
  const activeOrgs = [...document.querySelectorAll('[data-org]:checked')].map(el => el.dataset.org);
  const activeStates = [...document.querySelectorAll('[data-state]:checked')].map(el => el.dataset.state);
  
  const visibleNodes = new Set();
  nodes.forEach(n => {
    let show = true;
    if (n.group === 'province' && !activeProvs.includes(n.label)) show = false;
    if (n.group === 'external' && !activeOrgs.some(o => n.label.includes(o))) show = false;
    if (n._data && !activeStates.includes(n._data.stato)) show = false;
    if (show) visibleNodes.add(n.id);
  });
  
  const view = new vis.DataView(nodes, { filter: n => visibleNodes.has(n.id) });
  const edgeView = new vis.DataView(edges, { filter: e => visibleNodes.has(e.from) && visibleNodes.has(e.to) });
  network.setData({ nodes: view, edges: edgeView });
});

// Mobile filter toggle
document.getElementById('toggle-filters').addEventListener('click', function() {
  document.getElementById('filters').classList.toggle('open');
});
// Close filters on outside click (mobile)
document.getElementById('network').addEventListener('click', function() {
  if (window.innerWidth <= 768) {
    document.getElementById('filters').classList.remove('open');
  }
});
// Resize handler for vis.js
let resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() { network.fit({ animation: true }); }, 250);
});
</script>
